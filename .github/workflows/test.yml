name: Testar Veste & Cria

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gdscript:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Godot 4.7.2 com verificação de hash
        run: |
          set -euo pipefail
          VERSION=4.7.2-stable
          FILE=Godot_v${VERSION}_linux.x86_64.zip
          BASE=https://github.com/godotengine/godot-builds/releases/download/${VERSION}
          wget -q "${BASE}/${FILE}" -O "/tmp/${FILE}"
          wget -q "${BASE}/SHA512-SUMS.txt" -O /tmp/SHA512-SUMS.txt
          cd /tmp
          grep -F " ${FILE}" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${FILE}"
          sudo install "Godot_v${VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version | grep -q '^4\.7\.2\.stable'
      - name: Gerar imagens geométricas sintéticas para o CI público
        run: godot --headless --path . --script res://tools/create_ci_sprite_fixtures.gd
      - name: Importar recursos
        run: godot --headless --path . --editor --import --quit
      - name: Verificar plugin de cobrança
        run: (cd addons/GodotGooglePlayBilling && sha256sum -c SHA256SUMS)
      - name: Testes de catálogo e regras
        run: godot --headless --path . --script res://tests/test_catalog_and_rules.gd
      - name: Validar sprites autorais kawaii e compatibilidade de poses
        run: godot --headless --path . --script res://tests/test_kawaii_assets.gd
      - name: Testes de toque e exportação
        run: godot --headless --path . --script res://tests/test_studio_integration.gd
      - name: Instalar display virtual para exportação real
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Teste de PNG real com renderer gráfico (falha obrigatória se indisponível)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a godot --path . --script res://tests/test_graphical_export.gd
      - name: Testes de layout mobile e recortes
        run: godot --headless --path . --script res://tests/test_mobile_layout.gd
      - name: Invariantes de transparência e encaixe visual
        run: godot --headless --path . --script res://tests/test_visual_regressions.gd
      - name: Garantir isolamento do APK Pro de teste
        run: godot --headless --path . --script res://tests/test_pro_debug_preset.gd
      # Ações NÃO publicam binários. APK/AAB serão gerados em etapa privada.

name: Render kawaii PRO accessories to PNG

on:
  push:
    branches:
      - feature/kawaii-pro-assets-20261123
    paths:
      - .github/workflows/render-kawaii-accessories.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-kawaii-pro-assets
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/feature/kawaii-pro-assets-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PNG renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Render and commit each PNG separately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for index in $(seq -w 11 49); do
            svg="assets/kawaii/pro_kawaii_accessory_${index}.svg"
            png="assets/kawaii/pro_kawaii_accessory_${index}.png"
            test -s "$svg"
            if test -s "$png"; then
              echo "Already committed: $png"
              continue
            fi
            python - "$svg" "$png" <<'PY'
          import sys
          import cairosvg
          from PIL import Image
          source, target = sys.argv[1:]
          cairosvg.svg2png(url=source, write_to=target, output_width=1024, output_height=1536)
          with Image.open(target) as image:
              assert image.size == (1024, 1536), f"Invalid size: {source}"
              assert image.mode == "RGBA", f"Missing alpha: {source}"
              alpha = image.getchannel("A")
              assert alpha.getpixel((0, 0)) == 0 and alpha.getpixel((1023, 1535)) == 0
              bounds = alpha.getbbox()
              assert bounds and bounds[2] - bounds[0] > 35 and bounds[3] - bounds[1] > 35
          print(f"Validated {target}: 1024x1536 RGBA")
          PY
            git add -- "$png"
            git commit -m "assets(kawaii): render pro_kawaii_accessory_${index} PNG"
            git push origin HEAD:feature/kawaii-pro-assets-20261123
          done
